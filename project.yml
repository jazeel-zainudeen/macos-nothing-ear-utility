name: macos-nothing-ear-utility
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: 14.0
targets:
  NothingEarUtility:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_NAME: "Nothing Ear Utility"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Nothing Ear Utility needs Bluetooth access to connect to your Nothing Ear (2) and monitor battery levels."
        INFOPLIST_KEY_LSUIElement: "YES"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
