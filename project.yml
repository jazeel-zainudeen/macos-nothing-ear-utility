name: NothingBattery
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: 14.0
targets:
  NothingBattery:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "NothingBattery needs Bluetooth access to connect to your Nothing Ear (2) and monitor battery levels."
        INFOPLIST_KEY_LSUIElement: "YES"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
